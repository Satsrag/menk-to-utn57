<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TODO(security): Static hosts should also set HTTP headers: X-Frame-Options: DENY, Content-Security-Policy: frame-ancestors 'none', and X-Content-Type-Options: nosniff. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>menk-to-utn57 · Menk to UTN #57 Unicode WASM Demo</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">&#x182E;</span>
        <span class="brand-name">menk-to-utn57</span>
        <span class="brand-tag">WASM</span>
      </div>
      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" id="lang-zh" class="lang-btn active" data-lang="zh">中文</button>
          <button type="button" id="lang-en" class="lang-btn" data-lang="en">English</button>
        </div>
        <a class="source-link" href="https://github.com/Satsrag/menk-to-utn57" target="_blank" rel="noopener noreferrer" id="github-link">GitHub</a>
      </div>
    </header>

    <section class="intro">
      <div>
        <p class="eyebrow"><span aria-hidden="true"></span><span id="eyebrow-text"></span></p>
        <h1 id="hero-title"></h1>
        <p class="intro-copy" id="hero-subtitle"></p>
      </div>
      <div class="intro-status" id="wasm-status-pill"></div>
    </section>

    <main class="workspace">
      <section class="panel input-panel">
        <div class="panel-heading">
          <h2><span class="step">01</span><span id="input-heading"></span></h2>
          <button type="button" class="text-button" id="clear-btn"></button>
        </div>

        <div class="samples-block">
          <span class="field-label" id="samples-label"></span>
          <div class="samples" id="samples-list"></div>
        </div>

        <div class="field-block">
          <div class="field-row">
            <label class="field-label" for="menk-input" id="menk-label"></label>
            <span class="meta-hint" id="menk-count"></span>
          </div>
          <div class="menk-editor-row">
            <input
              id="menk-input"
              class="text-input menk-text-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
            >
            <div class="menk-vertical-box" aria-live="polite">
              <span class="vertical-caption" id="menk-preview-caption"></span>
              <span id="menk-vertical-preview" class="menk-vertical"></span>
            </div>
          </div>
          <div class="units-bar" id="units-bar" hidden>
            <span class="units-label" id="units-label"></span>
            <div class="units-list" id="units-list"></div>
          </div>
          <details class="code-details" id="menk-codes-details">
            <summary id="menk-codes-summary"></summary>
            <div class="codepoints" id="menk-codepoints"></div>
          </details>
        </div>

        <div class="field-block latin-block">
          <div class="field-row">
            <label class="field-label" for="latin-input" id="latin-label"></label>
            <div class="latin-controls">
              <span class="mode-badge" id="latin-mode-badge"></span>
              <button type="button" class="mini-button" id="reset-latin-btn" hidden></button>
            </div>
          </div>
          <input
            id="latin-input"
            class="text-input latin-text-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
          >
          <p class="field-help" id="latin-help"></p>
          <div class="toolbar">
            <span class="toolbar-label" id="special-latin-label"></span>
            <div class="toolbar-buttons" id="special-latin-buttons"></div>
          </div>

          <div class="k-row">
            <span class="field-label" id="k-label"></span>
            <div class="segmented" role="group" aria-label="K letter variant">
              <button type="button" id="k-ka" class="seg-btn active" data-k="ka"></button>
              <button type="button" id="k-kha" class="seg-btn" data-k="kha"></button>
            </div>
          </div>

          <details class="code-details legend-details">
            <summary id="latin-legend-summary"></summary>
            <div class="legend-grid" id="latin-legend-grid"></div>
          </details>
        </div>
      </section>

      <section class="panel output-panel">
        <div class="panel-heading">
          <h2><span class="step">02</span><span id="output-heading"></span></h2>
          <span class="count-pill" id="solution-count-pill"></span>
        </div>

        <div id="error-box" class="error-box" role="alert" hidden>
          <p class="error-title" id="error-title"></p>
          <p class="error-detail" id="error-detail"></p>
          <button type="button" class="mini-button error-reset-btn" id="error-reset-latin-btn" hidden></button>
        </div>

        <div id="empty-state" class="empty-state" hidden></div>
        <div id="solutions-list" class="solutions-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="footer-note"></span>
      <span>Apache-2.0 · UTN #57 / mongol-norm</span>
    </footer>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
