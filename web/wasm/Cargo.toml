[package]
name = "menk-to-utn57-web"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# Keep browser WASM bindings isolated from the pure-Rust core crate.
[workspace]

[dependencies]
menk-to-utn57 = { path = "../.." }
# Matches the installed wasm-bindgen-cli version checked by web/build.sh.
wasm-bindgen = "=0.2.125"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
